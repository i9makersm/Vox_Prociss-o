services:
  - type: web
    name: vox-procissao
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: vox-procissao-db
          property: connectionString
      - key: DATA_DIR
        value: /opt/render/project/src/data

databases:
  - name: vox-procissao-db
    databaseName: vox_procissao
    user: vox_procissao
    plan: free
